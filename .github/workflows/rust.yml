name: Rust

on:
  pull_request:
    branches: ["trunk"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Repair current transform anchor
        run: python .github/review-fix/repair.py

      - name: Apply review hardening
        run: python .github/review-fix/apply.py

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Capture clippy diagnostics
        run: |
          set +e
          cargo clippy --all-targets -- -D clippy::len_zero > /tmp/clippy.log 2>&1
          status=$?
          tail -n 240 /tmp/clippy.log > .github/clippy-error.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/clippy-error.txt
            git commit -m "record hardening clippy diagnostics"
            git push
          fi
          exit 0
