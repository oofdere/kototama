name: Rust

on:
  pull_request:
    branches: ["trunk"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Repair current transform anchor
        run: python .github/review-fix/repair.py

      - name: Apply review hardening
        run: python .github/review-fix/apply.py

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Remove temporary files
        run: rm -rf .github/review-fix .github/review-error.txt .github/build-error.txt .github/clippy-error.txt

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build all targets
        run: cargo build --all-targets --verbose

      - name: Run tests
        run: cargo test --verbose -- --test-threads=1

      - name: Check len-zero lint
        run: cargo clippy --all-targets -- -A clippy::not_unsafe_ptr_arg_deref -D clippy::len_zero

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src tests .github/review-fix .github/review-error.txt .github/build-error.txt .github/clippy-error.txt
          git commit -m "harden worker initialization and async errors"
          git push
