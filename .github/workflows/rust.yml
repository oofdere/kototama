name: Rust

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive 
    - name: Build
      run: cargo build --verbose
    # Examples and benches are not built by `cargo build` or `cargo test`,
    # so without this step an API change that breaks `examples/simple.rs`,
    # `examples/simple_chat.rs`, or `benches/inference.rs` passes CI.
    - name: Build examples and benches
      run: cargo build --examples --benches --verbose
    - name: Run tests
      run: cargo test --verbose -- --test-threads=1
