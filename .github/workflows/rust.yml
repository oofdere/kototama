name: Rust

on:
  pull_request:
    branches: ["trunk"]
    types: [ready_for_review]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply safety documentation
        run: python .github/document-safety.py

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Build all targets
        run: cargo build --all-targets --verbose

      - name: Run tests
        run: cargo test --verbose -- --test-threads=1

      - name: Commit verified documentation
        run: |
          if git diff --quiet -- src/context.rs src/sequence.rs src/samplers/mod.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context.rs src/sequence.rs src/samplers/mod.rs
          git commit -m "document context and sampler safety"
          git push
