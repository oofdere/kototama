name: Rust

on:
  pull_request:
    branches: ["trunk"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove stale context init wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/context.rs')
          text = path.read_text()
          old = '''    /// thread. Callback functions must be callable on that thread. Sampler
    /// chains and `ctx_other`, when provided, must not be used concurrently in a
    /// way that violates llama.cpp's requirements.
'''
          new = '''    /// thread. Callback functions must be callable on that thread. Sampler
    /// chains, when provided, must not be used concurrently in a way that
    /// violates llama.cpp's requirements.
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one documentation block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/doc-fix-trigger.txt

      - name: Commit documentation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context.rs .github/doc-fix-trigger.txt
          git commit -m "fix context initialization safety docs"
          git push
