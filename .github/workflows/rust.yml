name: Rust

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["trunk"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Apply cancellation-safety fixes
        run: |
          python .github/worker-fix/fix_context.py
          python .github/worker-fix/fix_misc.py
          rm -rf .github/worker-fix
          cat > .github/workflows/rust.yml <<'EOF'
          name: Rust

          on:
            push:
              branches: ["trunk"]
            pull_request:
              branches: ["trunk"]

          env:
            CARGO_TERM_COLOR: always

          jobs:
            build:
              runs-on: ubuntu-latest

              steps:
                - uses: actions/checkout@v4
                  with:
                    submodules: recursive

                - name: Install stable Rust
                  run: |
                    rustup toolchain install stable --profile minimal --component rustfmt
                    rustup default stable
                    rustc --version
                    cargo --version

                - name: Check formatting
                  run: cargo fmt --all --check

                - name: Build all targets
                  run: cargo build --all-targets --verbose

                - name: Run tests
                  run: cargo test --verbose -- --test-threads=1
          EOF
          sed -i 's/^          //' .github/workflows/rust.yml
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "make async sequence state cancellation-safe"
          git push

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build all targets
        run: cargo build --all-targets --verbose

      - name: Run tests
        run: cargo test --verbose -- --test-threads=1
