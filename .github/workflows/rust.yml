name: Rust

on:
  pull_request:
    branches: ["trunk"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false

      - name: Repair current transform anchor
        run: python .github/review-fix/repair.py

      - name: Capture full transform failure
        run: |
          set +e
          output=$(python .github/review-fix/apply.py 2>&1)
          status=$?
          printf '%s\n' "$output" > .github/review-error.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/review-error.txt
            git commit -m "record full review transform error"
            git push
          fi
          exit 0
