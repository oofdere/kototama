[workspace]
members = [
    "llama-sys",
]
resolver = "2"

[package]
name = "rusty-llama"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
llama-sys = { path = "llama-sys", features = ["native"] }
oneshot = { version = "0.2.1", features = ["std", "async"] }
pin-project-lite = "0.2"
rand = "0.9"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
insta = { version = "1.47.2", features = ["yaml"] }
pollster = "0.4"

[[bench]]
name = "inference"
harness = false
