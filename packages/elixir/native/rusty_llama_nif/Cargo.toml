[package]
name = "rusty_llama_nif"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bindings for rusty-llama"
readme = false
keywords = []
categories = ["text-processing"]

[workspace]

[lib]
name = "rusty_llama_nif"

crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
rusty-llama = { version = "0.1.0", path = "../../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
