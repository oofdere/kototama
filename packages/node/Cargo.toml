[package]
name = "rusty-llama-napi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "NAPI-RS bindings for rusty-llama"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi4", "tokio_rt"] }
napi-derive = "3"
rusty-llama = { version = "0.1.0", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
